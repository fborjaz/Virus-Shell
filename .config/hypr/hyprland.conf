################
### MONITORS ###
################

monitor=,preferred,auto,1
ecosystem:no_update_news = true
source = /home/virus/.cache/wal/colors-hyprland.conf

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$vol = pamixer --get-volume


#################
### AUTOSTART ###
#################

# Barra y Widgets (Ruta corregida y restaurada)
exec-once = bash -c '~/.config/eww/scripts/getvol.sh'
exec-once = bash -c '~/.config/eww/scripts/workspace.sh'
exec-once = ~/.config/eww/scripts/eww-watchdog.sh
exec-once = ~/.config/eww/scripts/bar-theme-toggle.sh --apply

# Fondo de Pantalla (swww — transiciones animadas; instala con: yay -S swww)
exec-once = bash -c 'command -v swww && swww-daemon || hyprpaper -c ~/.config/hypr/hyprpaper.conf'
exec-once = bash -c 'sleep 1 && ~/.config/hypr/scripts/random_wallpaper.sh'

# Notificaciones (swaync — panel deslizable)
exec-once = swaync

# OSD de volumen y brillo
exec-once = swayosd-server

# Servicios del sistema y Autenticación
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = sh ~/.config/hypr/scripts/text_animation/anitext.sh
exec-once = sh ~/.config/hypr/scripts/weather/weather.sh

# Hypridle (Desactivado para que no se apague la pantalla)
# exec-once = hypridle

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,miku-cursor
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
env = XCURSOR_PATH, /usr/share/icons:/home/$USER/.icons:/home/$USER/.local/share/icons
env = HYPRCURSOR_MOVE, fleur

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 5
    border_size = 3

    col.active_border = $color2 $color4 45deg
    col.inactive_border = rgba(0,0,0,0)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    # Transparencia ajustada para mejor legibilidad
    active_opacity = 0.85
    inactive_opacity = 0.75

    shadow {
        enabled = true
        range = 40
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5          # Reducido para que no sea tan fuerte
        passes = 2        # Solo una pasada para mayor nitidez
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = overshot,    0.05, 0.9,  0.1,  1.05
    bezier = smoothOut,   0.36, 0,    0.66, -0.56
    bezier = smoothIn,    0.25, 1,    0.5,  1
    bezier = easeOut,     0.16, 1,    0.3,  1
    bezier = linear,      0,    0,    1,    1
    bezier = snap,        0.87, 0,    0.13, 1

    # Ventanas — slide con rebote al abrir
    animation = windows,        1, 5,  overshot,  slide
    animation = windowsIn,      1, 5,  overshot,  slide
    animation = windowsOut,     1, 3,  smoothOut, slide
    animation = windowsMove,    1, 4,  overshot

    # Fade
    animation = fade,           1, 3,  smoothIn
    animation = fadeIn,         1, 3,  smoothIn
    animation = fadeOut,        1, 3,  smoothOut

    # Borde animado (gradiente rotatorio)
    animation = border,         1, 5,  easeOut
    animation = borderangle,    1, 8,  linear,    loop

    # Workspaces — deslizamiento vertical fluido
    animation = workspaces,     1, 5,  overshot,  slidevert

    # Capas (rofi, wlogout, swaync)
    animation = layers,         1, 3,  overshot,  fade
    animation = layersIn,       1, 4,  overshot,  fade
    animation = layersOut,      1, 2,  smoothOut, fade
    animation = fadeLayersIn,   1, 3,  smoothIn
    animation = fadeLayersOut,  1, 2,  smoothOut
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

#############
### INPUT ###
#############

input {
    # TECLADOS: us por defecto, latam secundario
    kb_layout = us,latam
    kb_variant =
    kb_model =
    # CAMBIO DE IDIOMA: Alt + Shift
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    # workspace_swipe = false
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Terminal (Super + T)
bind = $mainMod, T, exec, $terminal

# Cerrar App (Super + Q)
bind = $mainMod, Q, killactive,

# Explorador de Archivos (Super + E)
bind = $mainMod, E, exec, $fileManager

# Buscar App / Menú (Super + Espacio) - Ahora libre de conflictos
bind = $mainMod, SPACE, exec, $menu

# Salir de Hyprland (Super + M)
bind = $mainMod, M, exit,

# Flotante (Super + V)
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit,

# Movimiento de foco (Flechas)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cambiar workspace (Super + Números)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 0, workspace, 10

# Mover ventana a workspace (Super + Shift + Números)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad movido a la tecla N para no chocar con Capturas
bind = $mainMod, N, togglespecialworkspace, magic
bind = $mainMod SHIFT, N, movetoworkspace, special:magic

# Captura de pantalla estilo Windows (Win + Shift + S)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Reiniciar la barra manualmente si desaparece (Super + Alt + B)
bind = $mainMod ALT, B, exec, killall eww && eww open bar_widget

# Cambiar tema de barra (compacta/completa) con Super + Alt + C
bind = $mainMod ALT, C, exec, ~/.config/eww/scripts/bar-theme-toggle.sh

# Menú de apagado (wlogout) con Super + ESC
bind = SUPER, ESCAPE, exec, wlogout

# Centro de notificaciones (swaync) con Super + B
bind = $mainMod, B, exec, swaync-client -t

# Scroll workspaces con mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover/Redimensionar ventanas con mouse + Super
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Teclas multimedia (con OSD visual via SwayOSD)
bindel = ,XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Mutear/Desmutear micrófono con F10
bind = , F10, exec, ~/.local/bin/mic-toggle.sh

# Cambiar fondo de pantalla aleatorio (Super + Alt + W)
bind = $mainMod ALT, W, exec, ~/.config/hypr/scripts/random_wallpaper.sh
# Cambiar fondo de pantalla seleccionando (Super + Alt + s)
bind = $mainMod ALT, S, exec, ~/.config/hypr/scripts/select_wallpaper.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Líneas desactivadas para eliminar la barra roja de error
# windowrulev2 = suppressevent maximize, class:.*
# windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

misc {
    # Desactiva el apagado automático del monitor
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Desactivar fondo defaut
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# --- Reglas para Vesktop ---
# Opacidad general (ajusta el 0.9 a tu gusto)
windowrule = opacity 0.90 0.90, match:class vesktop

# Hacer que los diálogos de "Abrir archivo" floten y estén centrados
windowrule = float on, match:class vesktop, match:title (Open File)
windowrule = center on, match:class vesktop, match:title (Open File)
windowrule = size 800 600, match:class vesktop, match:title (Open File)

# Lo mismo para "Guardar archivo" y otros popups
windowrule = float on, match:class vesktop, match:title (Save File)
windowrule = float on, match:class vesktop, match:title (Discord Popout)


# Variables de entorno para Wayland y XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Tema GTK — Catppuccin Mocha
env = GTK_THEME,catppuccin-mocha-blue-standard+default
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3

# Sincronizar con DBus y systemd (Crucial para que funcionen los portales)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP